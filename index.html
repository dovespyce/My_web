  <style>
    /* =============================================
       CSS CUSTOM PROPERTIES
    ============================================= */
    :root {
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --accent: #3B82F6;
      --accent-2: #6366F1;
      --accent-glow: rgba(59,130,246,0.35);
      --accent-light: #60A5FA;
      --green: #10B981;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s cubic-bezier(.4,0,.2,1);
      --shadow-card: 0 8px 40px rgba(0,0,0,0.18);
    }

    [data-theme="dark"] {
      --bg: #080D1A;
      --bg-2: #0D1424;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-accent: rgba(59,130,246,0.3);
      --text: #F0F4FF;
      --text-muted: #8B9CC4;
      --text-dim: #4B5A7A;
      --nav-bg: rgba(8,13,26,0.85);
    }

    [data-theme="light"] {
      --bg: #F4F7FF;
      --bg-2: #EBF0FF;
      --bg-card: rgba(255,255,255,0.8);
      --bg-card-hover: rgba(255,255,255,0.95);
      --border: rgba(0,0,0,0.08);
      --border-accent: rgba(59,130,246,0.25);
      --text: #0F172A;
      --text-muted: #4B5A7A;
      --text-dim: #94A3B8;
      --nav-bg: rgba(244,247,255,0.85);
    }

    /* =============================================
       RESET & BASE
    ============================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ul { list-style: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }

    /* =============================================
       LOADER
    ============================================= */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-inner {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .loader-logo {
      font-family: var(--font-display);
      font-size: 2rem; font-weight: 800;
      background: linear-gradient(135deg, #3B82F6, #6366F1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .loader-bar {
      width: 200px; height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px; overflow: hidden;
    }
    .loader-progress {
      height: 100%; width: 0;
      background: linear-gradient(90deg, #3B82F6, #6366F1);
      border-radius: 99px;
      animation: loadProgress 1.8s ease forwards;
    }
    @keyframes loadProgress { to { width: 100%; } }

    /* =============================================
       SCROLLBAR
    ============================================= */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

    /* =============================================
       NAVIGATION
    ============================================= */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition), border-color var(--transition);
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px;
      height: 68px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.35rem; font-weight: 800;
      background: linear-gradient(135deg, #3B82F6, #6366F1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex; align-items: center; gap: 6px;
    }
    .nav-links a {
      font-size: 0.875rem; font-weight: 500;
      color: var(--text-muted);
      padding: 7px 14px; border-radius: 8px;
      transition: color var(--transition), background var(--transition);
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text);
      background: var(--bg-card);
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .theme-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      transition: all var(--transition);
    }
    .theme-btn:hover { color: var(--accent); border-color: var(--border-accent); }
    .nav-cta {
      padding: 8px 20px; border-radius: 10px;
      background: var(--accent);
      color: #fff; font-size: 0.875rem; font-weight: 600;
      transition: all var(--transition);
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      width: 40px; height: 40px;
      align-items: center; justify-content: center;
      border-radius: 10px; background: var(--bg-card);
      border: 1px solid var(--border);
    }
    .hamburger span {
      display: block; width: 20px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: all 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile Menu */
    .mobile-menu {
      display: none; position: fixed;
      top: 68px; left: 0; right: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px 24px;
      flex-direction: column; gap: 4px;
      z-index: 99;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      padding: 12px 16px; border-radius: 10px;
      color: var(--text-muted); font-weight: 500;
      transition: all var(--transition);
    }
    .mobile-menu a:hover { background: var(--bg-card); color: var(--text); }

    /* =============================================
       SECTIONS BASE
    ============================================= */
    section { padding: 100px 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .section-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.75rem; font-weight: 600;
      color: var(--accent);
      letter-spacing: 2px; text-transform: uppercase;
